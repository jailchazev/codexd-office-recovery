<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar contraseña | CodexD Office</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101827;color:#edf4ff;font-family:Arial,sans-serif}
main{width:100%;max-width:440px;padding:32px;background:#1b293d;border:1px solid #34445b;border-radius:18px}
h1{font-size:25px}.brand{color:#80baff;font-weight:bold;letter-spacing:2px}
p{color:#bac9dc;line-height:1.5}
label{display:block;margin:18px 0 7px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #50627a;background:#101827;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:#287ed1;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#status{margin-top:18px;padding:12px;background:#101827;border-radius:9px;white-space:pre-wrap}
small{display:block;margin-top:24px;color:#91a5bf}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="brand">CODEXD OFFICE</div>
<h1>Restablecer contraseña</h1>
<p id="intro">Solicita un enlace seguro en tu correo para crear una nueva contraseña.</p>

<form id="requestForm">
<label for="email">Correo de tu cuenta</label>
<input id="email" type="email" required autocomplete="email" placeholder="tu-correo@ejemplo.com">
<button id="requestButton">Enviar enlace de recuperación</button>
</form>

<form id="passwordForm" hidden>
<label for="password">Nueva contraseña</label>
<input id="password" type="password" minlength="8" required autocomplete="new-password">
<label for="confirm">Confirmar contraseña</label>
<input id="confirm" type="password" minlength="8" required autocomplete="new-password">
<button id="saveButton">Guardar nueva contraseña</button>
</form>

<div id="status">Puedes solicitar aquí un nuevo enlace de recuperación.</div>
<small>Desarrollado por CodexDigital-Perú</small>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://pzlqqkoksljjmyliohac.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8E1V7V6-XFnMQH2P9iApow_B-oFd7mO';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const requestForm = document.querySelector('#requestForm');
const passwordForm = document.querySelector('#passwordForm');
const status = document.querySelector('#status');
const requestButton = document.querySelector('#requestButton');
const saveButton = document.querySelector('#saveButton');

requestForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  requestButton.disabled = true;
  status.textContent = 'Enviando correo de recuperación...';

  const email = document.querySelector('#email').value.trim();
  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname
  });

  requestButton.disabled = false;
  status.textContent = error
    ? 'No se pudo enviar el correo: ' + error.message
    : 'Si la cuenta existe, recibirás un correo con el enlace de recuperación. Revisa también Spam o Correo no deseado. Abre el enlace desde este mismo navegador.';
});

async function initialize() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  const authError = hash.get('error_description') || query.get('error_description');

  if (authError) {
    status.textContent = 'El enlace presentó un error: ' + authError +
      '. Solicita uno nuevo usando el formulario.';
    return;
  }

  const code = query.get('code');
  if (code) {
    const { error } = await supabase.auth.exchangeCodeForSession(code);
    if (error) throw error;
  } else {
    const access_token = hash.get('access_token');
    const refresh_token = hash.get('refresh_token');
    if (access_token && refresh_token && hash.get('type') === 'recovery') {
      const { error } = await supabase.auth.setSession({ access_token, refresh_token });
      if (error) throw error;
    }
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    requestForm.hidden = true;
    passwordForm.hidden = false;
    document.querySelector('#intro').textContent = 'Enlace validado. Crea tu nueva contraseña.';
    status.textContent = 'Enlace válido. Introduce y confirma tu nueva contraseña.';
  } else if (!authError) {
    status.textContent = 'No hay un enlace de recuperación activo. Escribe tu correo para solicitar uno nuevo.';
  }
}

passwordForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.querySelector('#password').value;
  const confirm = document.querySelector('#confirm').value;

  if (password !== confirm) {
    status.textContent = 'Las contraseñas no coinciden.';
    return;
  }

  saveButton.disabled = true;
  status.textContent = 'Actualizando contraseña...';
  const { error } = await supabase.auth.updateUser({ password });
  saveButton.disabled = false;

  if (error) {
    status.textContent = 'No se pudo actualizar la contraseña: ' + error.message;
    return;
  }

  passwordForm.hidden = true;
  status.textContent = '¡Contraseña actualizada! Ya puedes iniciar sesión como administrador.';
  await supabase.auth.signOut();
  history.replaceState(null, '', location.pathname);
  requestForm.hidden = true;
});

initialize().catch(error => {
  status.textContent = 'No se pudo validar el enlace: ' + error.message +
    '. Solicita uno nuevo con el formulario.';
});
</script>
</body>
</html>
